<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <form action="" method="post" novalidate>
        <div>
            
            <h2>FORMULARIO DE INGRESO</h2>

            <label for="nombre">
                <span>Nombre:</span>
            </label>
            <input type="text" required id="nombre" minlength="3" name="nombre_usuario">
            <span class="error" aria-live="polite"></span>
        
            <label for="apellido">
                <span>Apellido:</span>
            </label>
            <input type="text" required id="apellido" minlength="3" name="apellido_user">
            <span class="error" aria-live="polite"></span>
       
            <label for="mail">
                <span>Email:</span>
            </label>
            <input type="email" required id="mail" name="mail_user">
            <span class="error" aria-live="polite"></span>
        
            <label for="fecha">
                <span>Fecha de Nacimiento:</span>
            </label>
            <input type="date" required id="fecha" max="2026-12-31" name="fecha_user">
             <span class="error" aria-live="polite"></span>

            <label for="pais">
                <span>País de Residencia:</span>
            </label>
            <input type="text" required id="pais" minlength="3" name="pais_user">
            <span class="error" aria-live="polite"></span>

            <button type="submit">Enviar</button>
            <button type="button" id="alto_contraste">Cambiar Estilo</button>   
            
        </div>

    </form>
    <script src="script.js"></script>
</body>
</html>
